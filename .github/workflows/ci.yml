name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/test_model.js
      - name: Demo data still generates
        run: node demo/make-demo.js
      - name: Backup refuses demo data
        run: bash tests/test_backup.sh

  validate:
    name: Omarchy manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same check `omarchy plugin validate` runs, fetched from Omarchy
      # itself so it stays current.
      - name: Fetch omarchy-plugin-validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/omacom/omarchy/contents/bin/omarchy-plugin-validate \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/validate"
      - run: bash "$RUNNER_TEMP/validate" .

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck backup.sh demo/screenshots.sh tests/*.sh

  qml:
    name: QML lint and tests
    runs-on: ubuntu-latest
    # Arch, like Omarchy, for a current Qt with qmllint and qmltestrunner.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed qt6-declarative git
      - uses: actions/checkout@v7
      # Omarchy's shell modules (qs.Ui, qs.Commons) from Omarchy itself, so
      # the plugin is checked against the current versions.
      - uses: actions/checkout@v7
        with:
          repository: omacom/omarchy
          path: .omarchy
          sparse-checkout: shell
      # Quickshell is not packaged for this container; tests/qml/fakes
      # stands in for it.
      - run: tests/lint.sh .omarchy/shell tests/qml/fakes
      - run: tests/qml.sh .omarchy/shell
